name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:test

  shared-dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/shared_dart
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  ops-console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: apps/ops_console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Authoritative run on real Supabase (Postgres 17, real auth schema and roles,
  # storage schema) using Docker on the GitHub runner. No hosted project, no secrets.
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - run: supabase db reset
      - run: pnpm db:test:supabase
      # Ops console end to end: real phone-OTP sign-in (test OTPs), RPCs and RLS.
      # The DB tests commit data, so start the browser run from a fresh seed.
      - run: supabase db reset
      - name: Configure the ops console for Supabase local
        run: |
          eval "$(supabase status -o env)"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > apps/ops_console/.env.local
      - run: pnpm --filter @companion/ops_console exec playwright install --with-deps chromium
      - run: pnpm --filter @companion/ops_console build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm --filter @companion/ops_console e2e
        env:
          CI: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-console-e2e
          path: |
            apps/ops_console/test-results/
            apps/ops_console/playwright-report/
          if-no-files-found: ignore
      - if: always()
        run: supabase stop --no-backup
